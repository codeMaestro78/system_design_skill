openapi: 3.0.3
info:
  title: Orders API
  version: 1.4.0
servers:
  - url: https://api.example.com
security:
  - bearerAuth: []
paths:
  /orders:
    post:
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id]
              properties:
                customer_id:
                  type: string
      responses:
        '201':
          description: Created
  /orders/{orderId}:
    get:
      summary: Fetch an order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
