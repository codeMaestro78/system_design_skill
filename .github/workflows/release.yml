name: Release system-design skill

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install check dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Install development tooling
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python scripts/check_skill.py
      - run: python evals/evaluate.py validate
      - run: python -m unittest discover -s tests -v
      - name: Read version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$tag" != "v${{ steps.version.outputs.version }}" ]; then
            echo "Tag $tag does not match VERSION ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi
      - name: Build package
        run: |
          python scripts/package.py --check
          python scripts/package.py --out dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: system-design ${{ steps.version.outputs.version }}
          files: dist/system-design.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
