# The skill is a collection of Markdown, YAML, SVG, and PNG files, not an
# installable Python distribution. This file therefore configures the
# development tooling only; it intentionally declares no build backend and no
# package metadata.
#
# The scripts support Python 3.9 and newer. 3.9 is the floor because
# `Path.is_relative_to` was added in 3.9 and is used by the package checks.

[tool.system-design]
requires-python = ">=3.9"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.9"
files = ["scripts", "evals", "tests"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
