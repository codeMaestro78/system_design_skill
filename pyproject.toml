# The skill is a collection of Markdown, YAML, SVG, and PNG files, not an
# installable Python distribution. This file therefore configures the
# development tooling only; it intentionally declares no build backend and no
# package metadata.
#
# The scripts support Python 3.9 and newer. 3.9 is the floor because
# `Path.is_relative_to` was added in 3.9 and is used by the package checks.

[tool.system-design]
# Not PEP 621 metadata: this repository is not an installable package, so
# there is no `[project]` table and no `[build-system]` table either. The
# value is a CI-only convention, enforced by the `validate-skill` workflow,
# which runs the required checks on Python 3.9 and on Python 3.12.
requires-python = ">=3.9"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
